name: Giants resale monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check 10/3 DeNA resale
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cat > monitor.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const URL = "https://tradead.tixplus.jp/giants/buy/bidding/listings/2770";

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage();

            await page.goto(URL, {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });

            await page.waitForTimeout(7000);

            const text = await page.locator("body").innerText();

            const normalized = text.replace(/\s+/g, " ").trim();

            console.log("Page loaded.");

            // 10/3のDeNA戦を探す
            const denaIndex = normalized.indexOf("DeNA");

            if (denaIndex === -1) {
              console.log("10/3 DeNA戦が見つかりませんでした。");
              console.log(normalized.slice(0, 3000));
              await browser.close();
              process.exit(1);
            }

            // DeNAの周辺だけを見る
            const area = normalized.slice(
              Math.max(0, denaIndex - 250),
              denaIndex + 250
            );

            console.log("対象試合周辺:");
            console.log(area);

            // DeNAの後ろにある「○件」を取得
            const afterDena = normalized.slice(denaIndex);

            const match = afterDena.match(/(\d+)\s*件/);

            if (!match) {
              console.log("チケット件数を取得できませんでした。");
              await browser.close();
              process.exit(1);
            }

            const currentCount = Number(match[1]);

            console.log(`10/3 DeNA戦: ${currentCount}件`);

            const stateFile = "dena-state.txt";

            const oldCount = fs.existsSync(stateFile)
              ? Number(fs.readFileSync(stateFile, "utf8").trim())
              : 0;

            console.log(`前回: ${oldCount}件`);
            console.log(`今回: ${currentCount}件`);

            // 現在の件数を保存
            fs.writeFileSync(stateFile, String(currentCount));

            // 0件 → 1件以上になった場合だけ通知
            if (oldCount === 0 && currentCount >= 1) {

              const message =
                "10月3日（土）DeNA戦のリセールチケットが出ました。\n\n" +
                `現在 ${currentCount}件あります。\n\n` +
                URL;

              const response = await fetch(
                `https://ntfy.sh/${process.env.NTFY_TOPIC}`,
                {
                  method: "POST",
                  headers: {
                    "Title": "巨人 10/3 DeNA リセール",
                    "Priority": "high"
                  },
                  body: message
                }
              );

              console.log(
                `Notification sent. HTTP ${response.status}`
              );

            } else {
              console.log("通知条件ではありません。");
            }

            await browser.close();
          })();
          EOF

          node monitor.js

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dena-state.txt

          git diff --cached --quiet || git commit -m "Update DeNA resale state"

          git push
